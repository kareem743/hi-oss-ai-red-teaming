name: BRITE Cloudflare pilot checks
on:
  push:
    branches:
      - 'brite/cloudflare-pilot'
    paths:
      - 'brite-cloudflare/**'
      - '.github/workflows/brite-cloudflare-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brite-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest uvicorn
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brite-cloudflare/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
