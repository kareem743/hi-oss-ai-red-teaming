name: BRITE Cloudflare pilot checks
on:
  push:
    branches:
      - 'brite/cloudflare-pilot'
    paths:
      - 'brite-cloudflare/**'
      - '.github/workflows/brite-cloudflare-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brite-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest uvicorn
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brite-cloudflare/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
  worker-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brite-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Install Cloudflare build CLI
        run: npm install --no-save --no-audit --no-fund cf@latest
      - name: Install Python Worker tooling
        run: uv sync --group dev
      - name: Vendor Pyodide-compatible Python dependencies
        run: uv run pywrangler sync
      - name: Build Python Worker for Cloudflare (no credentials)
        run: uv run npx cf build
      - name: Retain deployable output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brite-python-worker-build
          path: |
            brite-cloudflare/.cloudflare/output/v1/
            brite-cloudflare/python_modules/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
