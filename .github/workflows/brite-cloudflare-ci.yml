name: BRITE Cloudflare pilot checks
on:
  push:
    branches:
      - 'brite/cloudflare-pilot'
  pull_request:
    branches: ['brite/cloudflare-pilot']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brite-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest pytest-cov uvicorn
      - run: python -m compileall -q src tests
      - run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brite-cloudflare/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brite-cloudflare/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:db
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd brite-cloudflare && python -m pip install -e . uvicorn
      - run: cd brite-cloudflare/frontend && npm install --no-audit --no-fund && npm run build
      - run: cd brite-cloudflare/frontend && npx playwright install --with-deps chromium
      - run: cd brite-cloudflare/frontend && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: brite-cloudflare/frontend/playwright-report/
          retention-days: 7
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd brite-cloudflare && python -m pip install -e . pip-audit && python -m pip_audit --strict
      - run: cd brite-cloudflare/frontend && npm install --no-audit --no-fund && npm audit --audit-level=high
  worker-package:
    needs: [backend, frontend, database, browser, dependency-security]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brite-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: cd frontend && npm install --no-audit --no-fund && npm run build
      - name: Resolve and vendor Pyodide packages
        shell: bash
        run: |
          uv venv .venv-pyodide --python cpython-3.14.2-emscripten-wasm32-musl
          printf 'workers-runtime-sdk==1.9.7\n' > /tmp/brite-worker-sdk.in
          uv pip compile pyproject.toml /tmp/brite-worker-sdk.in --python cpython-3.14.2-emscripten-wasm32-musl --extra-index-url https://index.pyodide.org/314.0.7 --index-strategy unsafe-best-match --no-build -o /tmp/brite-worker-lock.txt
          VIRTUAL_ENV="$PWD/.venv-pyodide" uv pip install --only-binary :all: -r /tmp/brite-worker-lock.txt
          cp -a .venv-pyodide/lib/python3.14/site-packages python_modules
          touch python_modules/pyvenv.cfg
          du -sh python_modules
      - name: Retain deployable source and dependencies
        uses: actions/upload-artifact@v4
        with:
          name: brite-python-worker-package
          path: |
            brite-cloudflare/src/
            brite-cloudflare/python_modules/
            brite-cloudflare/frontend/dist/
            brite-cloudflare/cloudflare.config.ts
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
  quality-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, database, browser, dependency-security, worker-package]
    steps:
      - name: Reject failed or skipped required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          print({k:v['result'] for k,v in results.items()})
          assert all(v['result']=='success' for v in results.values()), 'Required quality check failed'
          PY
